# Life OS — https://life.o2lin1.com
# 静态前端由 Nginx 直出，/api 反代到本机 Node 服务（仅监听 127.0.0.1:8890）
#
# 注意：add_header 在子 location 中会覆盖父块继承，
# 因此每个自带 add_header 的 location 都要 include 安全头片段。

server {
    listen 80;
    listen [::]:80;
    server_name life.o2lin1.com;

    root /opt/lifeos/dist/web;
    index index.html;

    include /etc/nginx/snippets/lifeos-headers.conf;

    # 入口文件与 Service Worker 不缓存，保证更新即时生效
    location = /index.html {
        include /etc/nginx/snippets/lifeos-headers.conf;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    location = /sw.js {
        include /etc/nginx/snippets/lifeos-headers.conf;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    location = /manifest.webmanifest {
        include /etc/nginx/snippets/lifeos-headers.conf;
        types { } default_type application/manifest+json;
        add_header Cache-Control "no-cache" always;
    }

    # 带内容哈希的构建产物可长期缓存
    # 用 ^~ 前缀匹配，优先级高于下面的正则 location（nginx 中正则优先于普通前缀）
    location ^~ /assets/ {
        include /etc/nginx/snippets/lifeos-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }

    location ~* \.(?:js|css|woff2?|png|svg|webp|ico)$ {
        include /etc/nginx/snippets/lifeos-headers.conf;
        add_header Cache-Control "public, max-age=604800" always;
        access_log off;
    }

    # API 反向代理（Hono 自身也会下发安全头）
    location /api/ {
        proxy_pass http://127.0.0.1:8890;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
        # 语音上传预留（阶段 3）
        client_max_body_size 20m;
    }

    # SPA 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }
}
